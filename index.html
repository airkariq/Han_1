<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>잠수함 이미지 프롬프트 생성기</title>
<style>
:root {
  --bg:#07111f; --panel:#0d1b2a; --panel2:#102235; --line:#25415d;
  --text:#eaf4ff; --muted:#92a9bd; --accent:#37c6d8; --accent2:#7ce7ef;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:linear-gradient(180deg,#06101c,#0a1626);color:var(--text)}
header{padding:28px 24px 18px;max-width:1500px;margin:auto}
h1{margin:0 0 8px;font-size:30px}
header p{margin:0;color:var(--muted);line-height:1.6}
main{max-width:1500px;margin:auto;padding:0 24px 40px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,.65fr);gap:20px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
button{border:1px solid var(--line);background:#10263a;color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700}
button:hover{border-color:var(--accent);background:#123149}
button.primary{background:var(--accent);color:#03212a;border-color:var(--accent)}
button.danger{background:#251721;border-color:#5c3144}
.card{background:rgba(13,27,42,.96);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card h2{font-size:17px;margin:0}
.count{font-size:12px;color:var(--accent2);background:#0a2430;padding:4px 8px;border-radius:999px}
.search{width:100%;padding:9px 10px;border:1px solid var(--line);background:#081522;color:var(--text);border-radius:9px;margin-bottom:10px}
.keywords{display:flex;flex-wrap:wrap;gap:7px;max-height:190px;overflow:auto;padding-right:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #29465f;background:#0b1a29;padding:7px 9px;border-radius:9px;font-size:13px;cursor:pointer}
.chip input{accent-color:var(--accent)}
.custom{display:flex;gap:8px;margin-top:10px}
.custom input{flex:1;padding:9px 10px;border:1px solid var(--line);background:#081522;color:var(--text);border-radius:9px}
.sticky{position:sticky;top:12px;align-self:start}
.outbox{width:100%;min-height:245px;resize:vertical;background:#06111d;color:#dffaff;border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.55;font-family:Consolas,monospace}
.small{min-height:155px}
.section-title{font-size:14px;color:var(--accent2);margin:12px 0 7px;font-weight:700}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.options label{font-size:13px;color:var(--muted)}
.footer-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
@media(max-width:980px){main{grid-template-columns:1fr}.sticky{position:static}}
</style>
</head>
<body>
<header>
  <h1>잠수함 이미지 프롬프트 생성기</h1>
  <p>키워드를 선택하거나 직접 입력한 뒤 구조형·서술형 프롬프트를 생성합니다. 모든 처리는 브라우저 내부에서만 동작합니다.</p>
</header>

<main>
<section>
  <div class="toolbar">
    <button class="primary" onclick="applyPreset()">추천 예시 불러오기</button>
    <button onclick="selectRealism()">실사 품질 키워드 자동선택</button>
    <button class="danger" onclick="resetAll()">전체 초기화</button>
  </div>
  <div id="builder"></div>
</section>

<aside class="sticky">
  <div class="card">
    <div class="card-head"><h2>프롬프트 출력</h2><span class="count" id="totalCount">0개 선택</span></div>
    <div class="options">
      <label><input type="checkbox" id="constraintNo" checked> Constraints에 "no" 자동 적용</label>
      <label><input type="checkbox" id="autoUpdate" checked> 선택 즉시 자동 생성</label>
    </div>
    <button class="primary" style="width:100%;margin-bottom:10px" onclick="generate()">프롬프트 생성</button>

    <div class="section-title">구조형 프롬프트</div>
    <textarea id="structured" class="outbox" readonly></textarea>
    <div class="toolbar">
      <button onclick="copyText('structured')">구조형 복사</button>
      <button onclick="downloadText('structured','submarine_structured_prompt.txt')">TXT 저장</button>
    </div>

    <div class="section-title">서술형 프롬프트</div>
    <textarea id="narrative" class="outbox small" readonly></textarea>
    <div class="toolbar">
      <button onclick="copyText('narrative')">서술형 복사</button>
      <button onclick="downloadText('narrative','submarine_narrative_prompt.txt')">TXT 저장</button>
    </div>
    <div class="footer-note">팁: Subject는 1~2개, Camera는 2~4개, Style/Details는 4~8개 정도가 일반적으로 다루기 쉽습니다.</div>
  </div>
</aside>
</main>

const ORDER = ["Subject","Mission","Action","Environment","System","Camera","Lighting","Style","Motion","Details","Constraints"];

function makeId(s){return s.replace(/[^a-zA-Z0-9가-힣]/g,'_')}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

function render(){
  const root=document.getElementById('builder');
  root.innerHTML=ORDER.map(section=>`
    <div class="card" data-section="${section}">
      <div class="card-head">
        <h2>[${section}] ${LABELS[section]}</h2>
        <span class="count" id="count_${section}">0개</span>
      </div>
      <input class="search" placeholder="키워드 검색..." oninput="filterSection('${section}',this.value)">
      <div class="keywords" id="kw_${section}">
        ${DATA[section].map((kw,i)=>`
          <label class="chip" data-text="${escapeHtml(kw.toLowerCase())}">
            <input type="checkbox" class="kwcheck" data-section="${section}" value="${escapeHtml(kw)}" onchange="changed()">
            <span>${escapeHtml(kw)}</span>
          </label>`).join('')}
      </div>
      <div class="custom">
        <input id="custom_${section}" placeholder="직접 입력 (쉼표로 여러 개 입력 가능)" onkeydown="if(event.key==='Enter')addCustom('${section}')">
        <button onclick="addCustom('${section}')">추가</button>
      </div>
      <div class="keywords" id="customchips_${section}" style="margin-top:8px"></div>
    </div>`).join('');
  generate();
}

function filterSection(section,q){
  q=q.toLowerCase().trim();
  document.querySelectorAll(`#kw_${section} .chip`).forEach(el=>{
    el.style.display = !q || el.dataset.text.includes(q) ? 'inline-flex':'none';
  });
}

function addCustom(section){
  const input=document.getElementById('custom_'+section);
  const vals=input.value.split(',').map(x=>x.trim()).filter(Boolean);
  vals.forEach(v=>{
    const wrap=document.createElement('label');
    wrap.className='chip';
    wrap.innerHTML=`<input type="checkbox" class="kwcheck" data-section="${section}" value="${escapeHtml(v)}" checked onchange="changed()"><span>${escapeHtml(v)}</span><button type="button" onclick="event.preventDefault();this.parentElement.remove();changed()" style="padding:0 4px;border:0;background:transparent">×</button>`;
    document.getElementById('customchips_'+section).appendChild(wrap);
  });
  input.value='';
  changed();
}

function getSelected(section){
  return [...document.querySelectorAll(`.kwcheck[data-section="${section}"]:checked`)].map(x=>x.value);
}

function changed(){
  ORDER.forEach(s=>document.getElementById('count_'+s).textContent=getSelected(s).length+'개');
  document.getElementById('totalCount').textContent=ORDER.reduce((n,s)=>n+getSelected(s).length,0)+'개 선택';
  if(document.getElementById('autoUpdate').checked) generate();
}

function generate(){
  const noPrefix=document.getElementById('constraintNo').checked;
  let structured=[];
  let narrative=[];
  ORDER.forEach(s=>{
    let arr=getSelected(s);
    if(!arr.length) return;
    let output=arr;
    if(s==='Constraints' && noPrefix){
      output=arr.map(v=>/^(no\s|비|과도|잘못|기형|공중|물리|지나치|외부)/i.test(v)?v:`no ${v}`);
    }
    structured.push(`[${s}]\n${output.join(', ')}`);
    if(s!=='Constraints') narrative.push(output.join(', '));
  });
  const constraints=getSelected('Constraints');
  let tail='';
  if(constraints.length){
    const c=noPrefix?constraints.map(v=>/^(no\s|비|과도|잘못|기형|공중|물리|지나치|외부)/i.test(v)?v:`no ${v}`):constraints;
    tail=' Avoid: '+c.join(', ')+'.';
  }
  document.getElementById('structured').value=structured.join('\n\n');
  document.getElementById('narrative').value=(narrative.join('. ')+'.'+tail).replace(/^\.\s*/,'');
  changedNoLoop();
}

function changedNoLoop(){
  ORDER.forEach(s=>document.getElementById('count_'+s).textContent=getSelected(s).length+'개');
  document.getElementById('totalCount').textContent=ORDER.reduce((n,s)=>n+getSelected(s).length,0)+'개 선택';
}

function setChecks(section, values){
  document.querySelectorAll(`.kwcheck[data-section="${section}"]`).forEach(cb=>cb.checked=values.includes(cb.value));
}

function applyPreset(){
  resetAll(false);
  const preset={
    Subject:["modern attack submarine"],
    Mission:["anti-submarine warfare","target detection","target tracking"],
    Action:["silent cruising","active sonar ping","torpedo launch"],
    Environment:["deep ocean","underwater canyon","rocky seabed","suspended particles","underwater haze"],
    System:["bow sonar dome","flank array sonar","heavyweight torpedo","torpedo tube","pump-jet propulsion","optical mast"],
    Camera:["front three-quarter view","slightly low angle","cinematic wide shot","24mm lens","16:9"],
    Lighting:["cold blue lighting","volumetric underwater lighting","deep shadows","소나 발광 효과"],
    Style:["photorealistic","ultra realistic","military documentary","cinematic realism","physically based rendering"],
    Motion:["어뢰의 버블 트레일","수중 와류","소나 파동 확산","부유물 이동"],
    Details:["음향 흡수 타일","외판 패널","realistic hydrodynamics","authentic naval engineering","fine mechanical details","realistic depth perception"],
    Constraints:["cartoon","anime","toy-like","excessive futuristic design","spaceship design","laser weapons","과도한 폭발","외부에 노출된 승무원","text","watermark"]
  };
  Object.entries(preset).forEach(([s,v])=>setChecks(s,v));
  changed();
}

function selectRealism(){
  const picks={
    Style:["photorealistic","ultra realistic","cinematic realism","documentary realism","physically based rendering","PBR","HDR"],
    Details:["physically accurate scale","realistic proportions","realistic hydrodynamics","physically plausible lighting","authentic naval engineering","technically believable design","fine mechanical details","realistic depth perception"],
    Constraints:["cartoon","anime","toy-like","plastic model appearance","low-poly","game asset look","excessive futuristic design","malformed geometry","blurry","low resolution","distorted","artifacts","text","watermark"]
  };
  Object.entries(picks).forEach(([s,v])=>{
    document.querySelectorAll(`.kwcheck[data-section="${s}"]`).forEach(cb=>{if(v.includes(cb.value))cb.checked=true});
  });
  changed();
}

function resetAll(regen=true){
  document.querySelectorAll('.kwcheck').forEach(cb=>cb.checked=false);
  ORDER.forEach(s=>document.getElementById('customchips_'+s).innerHTML='');
  if(regen) changed();
}

async function copyText(id){
  const text=document.getElementById(id).value;
  try{await navigator.clipboard.writeText(text); alert('복사했습니다.')}catch(e){
    const ta=document.getElementById(id);ta.select();document.execCommand('copy');alert('복사했습니다.');
  }
}

function downloadText(id,filename){
  const blob=new Blob([document.getElementById(id).value],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

document.getElementById('constraintNo')?.addEventListener('change',generate);
render();
</script>
